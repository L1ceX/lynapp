[package]
name = "lynapp-remaster"
version = "2.0.0-beta.2"
description = "lynapp Minecraft launcher"
authors = ["L1ceX"]
edition = "2021"

[lib]
name = "lynapp_remaster_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lynapp"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart", "cookies"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v3"] }
dirs = "6"
sysinfo = "0.33"
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
url = "2"
once_cell = "1"
regex = "1"
rand = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
aes-gcm = "0.10"
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory", "Win32_System_Threading", "Win32_Globalization", "Win32_Graphics_Gdi"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
lto = "thin"
opt-level = "s"
strip = true
