name: Release

on:
  push:
    tags:
      - "v1.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Check version
        id: ver
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "package.json version '$version' is not valid semver" }
          if ("${{ github.ref_type }}" -eq "tag" -and "v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match package.json version $version" }
          $stale = Get-ChildItem -Path src -Recurse -Include *.ts,*.tsx | Select-String -Pattern 'lynapp/(\d+\.\d+\.\d+[0-9A-Za-z.\-]*)|launcher_version: "([^"]+)"' -AllMatches | ForEach-Object { $_.Matches } | Where-Object { ($_.Groups[1].Value + $_.Groups[2].Value) -ne $version }
          if ($stale) { $stale | ForEach-Object { Write-Host $_.Value }; throw "Version strings in src do not match $version" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck and build
        run: npm run build
        env:
          MAIN_VITE_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

      - name: Package Windows installers
        run: npx electron-builder --win nsis portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: lynapp-windows-${{ env.VERSION }}
          path: |
            release/lynapp-setup-${{ env.VERSION }}.exe
            release/lynapp-setup-${{ env.VERSION }}.exe.blockmap
            release/lynapp-portable-${{ env.VERSION }}.exe
            release/latest.yml
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Check version
        id: ver
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "package.json version '$version' is not valid semver" }
          if ("${{ github.ref_type }}" -eq "tag" -and "v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match package.json version $version" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Linux packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck and build
        run: npm run build
        env:
          MAIN_VITE_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

      - name: Package Linux targets
        run: npx electron-builder --linux AppImage deb rpm tar.gz --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: lynapp-linux-${{ env.VERSION }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.tar.gz
            release/latest-linux.yml
          if-no-files-found: error

  publish:
    needs: [build-windows, build-linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-windows.outputs.version }}
        run: |
          $tag = "${{ github.ref_name }}"
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          if ((git cat-file -t $tag) -ne "tag") { throw "Tag $tag has no description. Create it with: git tag -a $tag -m ""release notes""" }
          $notes = (git tag -l --format='%(contents)' $tag | Out-String).Trim()
          if (-not $notes) { throw "Tag $tag has an empty description" }
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          $files = Get-ChildItem -Path release-artifacts -File | Select-Object -ExpandProperty FullName
          if (-not $files -or $files.Count -lt 9) { throw "Expected at least 9 release assets, found $($files.Count)" }
          $flags = @()
          if ($env:VERSION -match '-') { $flags += "--prerelease" }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title $env:VERSION --notes-file release-notes.md --verify-tag @flags
          }
          if ($LASTEXITCODE -ne 0) { throw "Publishing failed" }
          $assets = (gh release view $tag --json assets --jq '.assets | length')
          Write-Host "Published $tag with $assets files"
