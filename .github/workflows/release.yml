name: Release v2

on:
  push:
    tags:
      - "v2.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Check version
        id: ver
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "package.json version '$version' is not valid semver" }
          $tauriVer = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tauriVer -ne $version) { throw "tauri.conf.json version '$tauriVer' does not match $version" }
          $cargoToml = Get-Content src-tauri/Cargo.toml -Raw
          if ($cargoToml -notmatch ('version\s*=\s*"' + [regex]::Escape($version) + '"')) { throw "Cargo.toml version does not match $version" }
          if ("${{ github.ref_type }}" -eq "tag" -and "v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match version $version" }
          $stale = Get-ChildItem -Path src-tauri/src -Recurse -Include *.rs | Select-String -Pattern 'lynapp/(\d+\.\d+\.\d+[0-9A-Za-z.\-]*)|LAUNCHER_VERSION: &str = "([^"]+)"' -AllMatches | ForEach-Object { $_.Matches } | Where-Object { ($_.Groups[1].Value + $_.Groups[2].Value) -ne $version }
          if ($stale) { $stale | ForEach-Object { Write-Host $_.Value }; throw "Version strings in src-tauri/src do not match $version" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Windows NSIS and portable
        shell: pwsh
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MAIN_VITE_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          npx tauri build --bundles nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force release-win | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe release-win/
          Copy-Item src-tauri/target/release/lynapp.exe "release-win/lynapp-portable-${env:VERSION}.exe"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: lynapp-v2-windows-${{ env.VERSION }}
          path: release-win/*
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Check version
        id: ver
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "package.json version '$version' is not valid semver" }
          if ("${{ github.ref_type }}" -eq "tag" -and "v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match version $version" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config libgtk-3-dev rpm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Linux bundles
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MAIN_VITE_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npx tauri build --bundles deb,rpm,appimage

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: lynapp-v2-linux-${{ env.VERSION }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  publish:
    needs: [build-windows, build-linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-windows.outputs.version }}
        run: |
          $tag = "${{ github.ref_name }}"
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          if ((git cat-file -t $tag) -ne "tag") { throw "Tag $tag has no description. Create it with: git tag -a $tag -m ""release notes""" }
          $notes = (git tag -l --format='%(contents)' $tag | Out-String).Trim()
          if (-not $notes) { throw "Tag $tag has an empty description" }
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          $files = Get-ChildItem -Path release-artifacts -File | Select-Object -ExpandProperty FullName
          if (-not $files -or $files.Count -lt 2) { throw "Expected at least 2 release assets, found $($files.Count)" }
          $flags = @()
          if ($env:VERSION -match '-') { $flags += "--prerelease" }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title $env:VERSION --notes-file release-notes.md --verify-tag @flags
          }
          if ($LASTEXITCODE -ne 0) { throw "Publishing failed" }
          $assets = (gh release view $tag --json assets --jq '.assets | length')
          Write-Host "Published $tag with $assets files"
